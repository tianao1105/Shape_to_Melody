<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape to Melody</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Shape to Melody</h1>
      <p data-i18n="subtitle">画出形状，听见旋律</p>
      <div id="mode-toggle-group" role="group" aria-label="theme mode">
        <button class="mode-toggle-btn active" data-mode="light" type="button" title="浅色模式" aria-label="light mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/></svg>
        </button>
        <button class="mode-toggle-btn" data-mode="dark" type="button" title="深色模式" aria-label="dark mode">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10z"/></svg>
        </button>
      </div>
      <div id="theme-picker"><!-- dots rendered by theme.js --></div>
      <button id="btn-help" title="重新观看教程" aria-label="tutorial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><line x1="12" y1="17" x2="12" y2="17"/></svg>
      </button>
      <button id="lang-toggle" onclick="toggleLang()">EN</button>
    </header>

    <div id="main">
      <!-- Left sidebar: drawing controls -->
      <div id="sidebar-left">
        <div class="panel" data-collapse-key="brush">
          <h3>
            <span data-i18n="brush-tools">笔触</span>
            <button class="collapse-btn" type="button" aria-label="toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </h3>
          <div class="panel-body">
          <div class="tool-grid" id="tool-btns">
            <button class="tool-btn active" data-mode="freehand">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c4-2 6-12 16-12"/><circle cx="4" cy="18" r="1.5" fill="currentColor"/></svg>
              <span data-i18n="tool-freehand">画笔</span>
            </button>
            <button class="tool-btn" data-mode="neon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19c4-4 10-4 14 0" opacity="0.35" stroke-width="6"/><path d="M5 19c4-4 10-4 14 0"/></svg>
              <span data-i18n="tool-neon">霓虹</span>
            </button>
            <button class="tool-btn" data-mode="spray">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="8" r="1.2"/><circle cx="11" cy="6" r="1"/><circle cx="9" cy="13" r="1.4"/><circle cx="15" cy="10" r="1"/><circle cx="14" cy="16" r="1.3"/><circle cx="18" cy="14" r="1"/><circle cx="7" cy="17" r="1"/></svg>
              <span data-i18n="tool-spray">喷雾</span>
            </button>
            <button class="tool-btn" data-mode="calligraphy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19l8-14" stroke-width="5" opacity="0.45"/><path d="M5 19l8-14"/></svg>
              <span data-i18n="tool-calligraphy">书法</span>
            </button>
            <button class="tool-btn" data-mode="rainbow">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M3 19a9 9 0 0118 0" stroke="#EF6B7C"/><path d="M5 19a7 7 0 0114 0" stroke="#FFD877"/><path d="M7 19a5 5 0 0110 0" stroke="#8AD7C5"/><path d="M9 19a3 3 0 016 0" stroke="#C9B6FF"/></svg>
              <span data-i18n="tool-rainbow">彩虹</span>
            </button>
          </div>
          </div>
        </div>

        <div class="panel" data-collapse-key="shape">
          <h3>
            <span data-i18n="shape-tools">形状</span>
            <button class="collapse-btn" type="button" aria-label="toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </h3>
          <div class="panel-body">
          <div class="tool-grid" id="shape-btns">
            <button class="tool-btn" data-mode="line">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
              <span data-i18n="tool-line">直线</span>
            </button>
            <button class="tool-btn" data-mode="rect">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="5" y="6" width="14" height="12" rx="1.5"/></svg>
              <span data-i18n="tool-rect">矩形</span>
            </button>
            <button class="tool-btn" data-mode="circle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="7"/></svg>
              <span data-i18n="tool-circle">圆形</span>
            </button>
            <button class="tool-btn" data-mode="heart">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.65A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg>
              <span data-i18n="tool-heart">心形</span>
            </button>
            <button class="tool-btn" data-mode="triangle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><polygon points="12,5 20,19 4,19"/></svg>
              <span data-i18n="tool-triangle">三角</span>
            </button>
            <button class="tool-btn" data-mode="star">
              <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12,3 14.6,9.5 21.5,9.8 16.2,14.3 18,21 12,17.3 6,21 7.8,14.3 2.5,9.8 9.4,9.5"/></svg>
              <span data-i18n="tool-star">星形</span>
            </button>
          </div>
          </div>
        </div>

        <div class="panel" data-collapse-key="canvasmode">
          <h3>
            <span data-i18n="canvas-mode">画布模式</span>
            <button class="collapse-btn" type="button" aria-label="toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </h3>
          <div class="panel-body">
          <div class="btn-group-v" id="canvas-mode-btns">
            <button class="mode-btn active" data-mode="normal">
              <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></span>
              <span data-i18n="mode-normal">普通</span>
            </button>
            <button class="mode-btn" data-mode="symmetric">
              <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2"/><line x1="12" y1="6" x2="12" y2="18" stroke-dasharray="2 2"/></svg></span>
              <span data-i18n="mode-symmetric">左右对称</span>
            </button>
            <button class="mode-btn" data-mode="kaleidoscope">
              <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="6" width="16" height="12" rx="2"/><line x1="12" y1="6" x2="12" y2="18" stroke-dasharray="2 2"/><line x1="4" y1="12" x2="20" y2="12" stroke-dasharray="2 2"/></svg></span>
              <span data-i18n="mode-kaleidoscope">万花筒</span>
            </button>
          </div>
          </div>
        </div>

        <div class="panel" data-collapse-key="brushsize">
          <h3>
            <span><span data-i18n="brush-size">笔刷大小</span> &nbsp;<span id="brush-size-val">6</span></span>
            <button class="collapse-btn" type="button" aria-label="toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </h3>
          <div class="panel-body">
          <input type="range" id="brush-size" min="2" max="24" value="6">
          </div>
        </div>

        <div class="panel" data-collapse-key="color">
          <h3>
            <span data-i18n="color">颜色</span>
            <button class="collapse-btn" type="button" aria-label="toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </h3>
          <div class="panel-body">
          <div class="color-row">
            <div class="color-swatch active" data-color="#ffffff" style="background:#ffffff"></div>
            <div class="color-swatch" data-color="#c0c0c0" style="background:#c0c0c0"></div>
            <div class="color-swatch" data-color="#808080" style="background:#808080"></div>
            <div class="color-swatch" data-color="#000000" style="background:#000000"></div>
            <div class="color-swatch" data-color="#ff0000" style="background:#ff0000"></div>
            <div class="color-swatch" data-color="#800000" style="background:#800000"></div>
            <div class="color-swatch" data-color="#ff8000" style="background:#ff8000"></div>
            <div class="color-swatch" data-color="#ffff00" style="background:#ffff00"></div>
            <div class="color-swatch" data-color="#808000" style="background:#808000"></div>
            <div class="color-swatch" data-color="#00cc00" style="background:#00cc00"></div>
            <div class="color-swatch" data-color="#008000" style="background:#008000"></div>
            <div class="color-swatch" data-color="#00ffff" style="background:#00ffff"></div>
            <div class="color-swatch" data-color="#008080" style="background:#008080"></div>
            <div class="color-swatch" data-color="#0000ff" style="background:#0000ff"></div>
            <div class="color-swatch" data-color="#ff00ff" style="background:#ff00ff"></div>
            <div class="color-swatch" data-color="#800080" style="background:#800080"></div>
          </div>
          </div>
        </div>

        <div class="undo-redo-row">
          <button id="btn-undo" class="btn-secondary" disabled title="Ctrl+Z">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 015 5v0a5 5 0 01-5 5h-4"/></svg>
            <span data-i18n="btn-undo">撤销</span>
          </button>
          <button id="btn-redo" class="btn-secondary" disabled title="Ctrl+Shift+Z">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 00-5 5v0a5 5 0 005 5h4"/></svg>
            <span data-i18n="btn-redo">重做</span>
          </button>
        </div>
        <button id="btn-clear" class="btn-secondary full-width">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          <span data-i18n="btn-clear">清除画布</span>
        </button>
      </div>

      <!-- Canvas area -->
      <div id="canvas-area">
        <!-- Mode toggle: vertical bookmark tabs on the LEFT edge of canvas -->
        <div id="mode-toggle">
          <button class="mode-tab active" data-canvas-mode="draw">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3.5-1L20 6.5a2.1 2.1 0 0 0-3-3L3.5 17 2.5 21z"/><path d="M14 6l3 3"/></svg>
            <span data-i18n="tab-draw">绘画</span>
          </button>
          <button class="mode-tab" data-canvas-mode="upload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span data-i18n="tab-upload">上传</span>
          </button>
        </div>
        <div id="canvas-wrap">
          <div id="layer-bar">
            <div id="layer-tabs">
              <button id="btn-add-layer" title="Add layer">+</button>
            </div>
            <div id="layer-props">
              <select id="layer-inst-select"></select>
              <span class="lp-sep"></span>
              <label class="lp-label" for="layer-vol">Vol</label>
              <input type="range" id="layer-vol" min="0" max="100" value="80">
              <span id="layer-vol-val">80</span>
            </div>
          </div>
          <div id="canvas-container">
            <canvas id="main-canvas"></canvas>
            <canvas id="piano-roll-canvas" class="hidden"></canvas>
            <canvas id="workspace-canvas"  class="hidden"></canvas>
            <div class="canvas-hint" id="canvas-hint">
              <span class="hint-icon">♪</span>
              <span data-i18n="canvas-hint">在这里画点什么</span>
            </div>
            <div id="upload-dropzone" class="hidden" tabindex="0">
              <div class="dz-plus" aria-hidden="true">
                <svg viewBox="0 0 100 100" class="dz-rings">
                  <circle class="ring r1" cx="50" cy="50" r="44"/>
                  <circle class="ring r2" cx="50" cy="50" r="36"/>
                  <circle class="ring r3" cx="50" cy="50" r="28"/>
                </svg>
                <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="6" x2="12" y2="18"/>
                  <line x1="6" y1="12" x2="18" y2="12"/>
                </svg>
              </div>
              <div class="dz-text">
                <strong data-i18n="dz-title">拖入图片或点击浏览</strong>
                <span    data-i18n="dz-sub">PNG · JPG · 自动转换为线条与旋律</span>
              </div>
              <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
            </div>
            <div id="partial-overlay" class="hidden">
              <div id="partial-band">
                <span class="band-label" data-i18n="band-label">拖动调整范围</span>
              </div>
            </div>
          </div>
        </div>
        <!-- View toggle: vertical bookmark tabs on the right edge of canvas -->
        <div id="view-toggle">
          <button class="view-btn active" data-view="drawing"   data-i18n="tab-drawing">画布</button>
          <button class="view-btn"        data-view="pianoroll" data-i18n="tab-pianoroll">琴谱</button>
        </div>
      </div>

      <!-- Right sidebar: playback controls -->
      <div id="sidebar-right">
        <div class="panel">
          <h3 data-i18n="convert-mode">转换方式</h3>
          <div class="btn-group-v" id="convert-mode-btns">
            <button class="mode-btn active" data-mode="full">
              <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="9" width="18" height="6" rx="1.5"/></svg></span>
              <span data-i18n="mode-full">全部转换</span>
            </button>
            <button class="mode-btn" data-mode="partial">
              <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="9" width="18" height="6" rx="1.5"/><rect x="8" y="9" width="8" height="6" fill="currentColor" rx="1"/></svg></span>
              <span data-i18n="mode-partial">部分转换</span>
            </button>
            <button class="mode-btn" data-mode="random">
              <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="8" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="7" r="1.5"/><circle cx="9" cy="16" r="1.5"/><circle cx="17" cy="15" r="1.5"/></svg></span>
              <span data-i18n="mode-random">随机转换</span>
            </button>
          </div>
        </div>

        <div class="panel">
          <h3><span data-i18n="sampling-interval">采样间隔</span> &nbsp;<span id="sampling-val">60</span>px</h3>
          <input type="range" id="sampling-interval" min="1" max="200" value="60">
        </div>

        <div class="panel">
          <h3 data-i18n="scale">音阶</h3>
          <select id="scale-select">
            <option value="pentatonic" data-i18n="scale-pentatonic">五声音阶</option>
            <option value="major"      data-i18n="scale-major">大调</option>
            <option value="minor"      data-i18n="scale-minor">小调</option>
            <option value="chromatic"  data-i18n="scale-chromatic">半音阶</option>
          </select>
        </div>

        <div class="panel">
          <h3><span data-i18n="tempo">速度</span> &nbsp;<span id="bpm-val">120</span> BPM</h3>
          <input type="range" id="bpm" min="40" max="240" value="120">
        </div>

        <div id="play-controls">
          <button id="btn-convert" class="btn-primary full-width">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            <span data-i18n="btn-convert">转换</span>
          </button>
          <button id="btn-play" class="btn-primary full-width" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
            <span data-i18n="btn-play">播放</span>
          </button>
          <button id="btn-stop" class="btn-secondary full-width">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
            <span data-i18n="btn-stop">停止</span>
          </button>
          <div class="export-row">
            <select id="export-format">
              <option value="midi">MIDI</option>
              <option value="wav">WAV</option>
              <option value="mp3">MP3</option>
            </select>
            <button id="btn-export" class="btn-secondary" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span data-i18n="btn-export">导出</span>
            </button>
          </div>
        </div>

        <div id="status-bar"></div>
      </div>
    </div>
  </div>

  <!-- Intro animation overlay -->
  <div id="intro-overlay">
    <div class="intro-stage">
      <div class="intro-words" id="intro-words"></div>
      <svg class="intro-piano" id="intro-piano" viewBox="0 0 220 100" aria-hidden="true">
        <rect class="piano-body" x="2" y="6" width="216" height="88" rx="10"/>
        <rect class="piano-top"  x="6" y="10" width="208" height="14" rx="4"/>
        <g class="white-keys">
          <rect x="10" y="30" width="20" height="60" rx="2"/>
          <rect x="32" y="30" width="20" height="60" rx="2"/>
          <rect x="54" y="30" width="20" height="60" rx="2"/>
          <rect x="76" y="30" width="20" height="60" rx="2"/>
          <rect x="98" y="30" width="20" height="60" rx="2"/>
          <rect x="120" y="30" width="20" height="60" rx="2"/>
          <rect x="142" y="30" width="20" height="60" rx="2"/>
          <rect x="164" y="30" width="20" height="60" rx="2"/>
          <rect x="186" y="30" width="20" height="60" rx="2"/>
        </g>
        <g class="black-keys" fill="#16161c">
          <rect x="24" y="30" width="14" height="38" rx="2"/>
          <rect x="46" y="30" width="14" height="38" rx="2"/>
          <rect x="90" y="30" width="14" height="38" rx="2"/>
          <rect x="112" y="30" width="14" height="38" rx="2"/>
          <rect x="134" y="30" width="14" height="38" rx="2"/>
          <rect x="178" y="30" width="14" height="38" rx="2"/>
          <rect x="200" y="30" width="14" height="38" rx="2"/>
        </g>
      </svg>
    </div>
    <button id="intro-skip" type="button">Skip ›</button>
  </div>

  <!-- Tutorial overlay (shown after intro) -->
  <div id="tutorial-overlay" class="hidden">
    <!-- .tut-hole's own box-shadow is the dim layer; no separate backdrop. -->
    <div class="tut-hole" id="tut-hole"></div>
    <div class="tut-ring" id="tut-ring"></div>
    <div class="tutorial-bubble" id="tutorial-bubble">
      <div class="tut-step">1 / 4</div>
      <h4 class="tut-title">欢迎！</h4>
